<template>
    <lightning-card title="Leave Request Form">
        <div class="slds-p-around_medium">

            <!-- Employee -->
            <lightning-record-picker
                label="Employee"
                placeholder="Search Employees..."
                object-api-name="Employee__c"
                value={employeeId}
                onchange={handleEmployeeChange}
                required>
            </lightning-record-picker>

            <!-- Leave Type -->
            <div class="slds-m-top_medium">
                <lightning-combobox
                    label="Leave Type"
                    placeholder="Select Leave Type"
                    value={leaveType}
                    options={leaveTypeOptions}
                    onchange={handleLeaveTypeChange}
                    required>
                </lightning-combobox>
            </div>

            <!-- Leave Reason -->
            <div class="slds-m-top_medium">
                <lightning-textarea
                    name="leaveReason"
                    label="Leave Reason"
                    value={leaveReason}
                    onchange={handleReasonChange}>
                </lightning-textarea>
            </div>

            <!-- From Date -->
            <div class="slds-m-top_medium">
                <lightning-input
                    type="date"
                    name="fromDate"
                    label="From"
                    value={fromDate}
                    onchange={handleFromDateChange}
                    required>
                </lightning-input>
            </div>

            <!-- To Date -->
            <div class="slds-m-top_medium">
                <lightning-input
                    type="date"
                    name="toDate"
                    label="To"
                    value={toDate}
                    onchange={handleToDateChange}
                    required>
                </lightning-input>
            </div>

            <!-- Submit -->
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Submit Leave Request"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
